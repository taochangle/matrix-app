services:
  app:
    build: .
    ports:
      - "4000:8000"
    volumes:
      - .:/app
      - ../matrix-framework:/matrix-framework
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: matrix
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: matrix-secret-key

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: matrix
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
